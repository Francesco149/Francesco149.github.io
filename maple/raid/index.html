<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Legion Raid Power Simulator</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                font-family: sans-serif;
                background: #1a1a1a;
                color: #eee;
                padding: 20px;
            }
            .container {
                max-width: 1000px;
                margin: auto;
            }
            .chart-box {
                background: #2a2a2a;
                padding: 20px;
                margin-bottom: 30px;
                border-radius: 8px;
            }
            .controls {
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            input {
                background: #333;
                color: white;
                border: 1px solid #555;
                padding: 5px;
                border-radius: 4px;
                width: 150px;
            }
            canvas {
                max-height: 450px;
            }
            h3 {
                margin-top: 0;
                color: #ff4757;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="chart-box">
                <h3>Average Level vs Raid Power</h3>
                <div class="controls">
                    <label>Average Char Combat:</label>
                    <input
                        type="number"
                        id="fixedCP1"
                        value="5000000"
                        oninput="updateChart1()"
                    />
                </div>
                <canvas id="chart1"></canvas>
            </div>

            <div class="chart-box">
                <h3>Average Combat vs Raid Power</h3>
                <div class="controls">
                    <label>Fixed Avg Lvl:</label>
                    <input
                        type="number"
                        id="fixedLvl2"
                        value="225"
                        oninput="updateChart2()"
                    />
                </div>
                <canvas id="chart2"></canvas>
            </div>
        </div>

        <script>
            function getLevelPower(lvl) {
                if (lvl < 60) return 0;
                if (lvl < 100) return 0.5 * Math.pow(lvl, 3);
                if (lvl < 140) return 0.4 * Math.pow(lvl, 3);
                if (lvl < 180) return 0.7 * Math.pow(lvl, 3);
                if (lvl < 200) return 0.8 * Math.pow(lvl, 3);
                if (lvl < 210) return 1.0 * Math.pow(lvl, 3);
                if (lvl < 220) return 1.1 * Math.pow(lvl, 3);
                if (lvl < 230) return 1.15 * Math.pow(lvl, 3);
                if (lvl < 240) return 1.2 * Math.pow(lvl, 3);
                if (lvl < 250) return 1.25 * Math.pow(lvl, 3);
                if (lvl < 260) return 1.3 * Math.pow(lvl, 3);
                if (lvl < 270) return 1.35 * Math.pow(lvl, 3);
                if (lvl < 280) return 1.4 * Math.pow(lvl, 3);
                if (lvl < 290) return 1.45 * Math.pow(lvl, 3);
                if (lvl < 300) return 1.5 * Math.pow(lvl, 3);
                return 1.55 * Math.pow(lvl, 3);
            }

            function getCPPower(cp) {
                let multiplier = 2.0;
                if (cp >= 500000000) multiplier = 2.9;
                else if (cp >= 400000000) multiplier = 2.85;
                else if (cp >= 350000000) multiplier = 2.8;
                else if (cp >= 300000000) multiplier = 2.75;
                else if (cp >= 250000000) multiplier = 2.7;
                else if (cp >= 200000000) multiplier = 2.65;
                else if (cp >= 175000000) multiplier = 2.6;
                else if (cp >= 150000000) multiplier = 2.55;
                else if (cp >= 125000000) multiplier = 2.5;
                else if (cp >= 100000000) multiplier = 2.45;
                else if (cp >= 80000000) multiplier = 2.4;
                else if (cp >= 60000000) multiplier = 2.35;
                else if (cp >= 40000000) multiplier = 2.3;
                else if (cp >= 20000000) multiplier = 2.25;
                else if (cp >= 10000000) multiplier = 2.2;
                else if (cp >= 5000000) multiplier = 2.15;
                else if (cp >= 1000000) multiplier = 2.1;
                else if (cp >= 500000) multiplier = 2.05;
                return multiplier * 750 * Math.sqrt(cp + 30000);
            }

            function getAttackerCount(avgLvl) {
                const levelSum = avgLvl * 42;
                if (levelSum < 500) return 9;
                if (levelSum < 1000) return 10;
                if (levelSum < 1500) return 11;
                if (levelSum < 2000) return 12;
                if (levelSum < 2500) return 13;
                if (levelSum < 3000) return 18;
                if (levelSum < 3500) return 19;
                if (levelSum < 4000) return 20;
                if (levelSum < 4500) return 21;
                if (levelSum < 5000) return 22;
                if (levelSum < 5500) return 27;
                if (levelSum < 6000) return 28;
                if (levelSum < 6500) return 29;
                if (levelSum < 7000) return 30;
                if (levelSum < 7500) return 31;
                if (levelSum < 8000) return 36;
                if (levelSum < 8500) return 37;
                if (levelSum < 9000) return 38;
                if (levelSum < 9500) return 39;
                if (levelSum < 10000) return 40;
                if (levelSum < 10500) return 41;
                if (levelSum < 11000) return 42;
                if (levelSum < 11500) return 43;
                if (levelSum < 12000) return 44;
                return 45;
            }

            function calcLegionPower(avgLvl, avgCP) {
                const numAttackers = getAttackerCount(avgLvl);
                return (
                    numAttackers *
                    (getLevelPower(avgLvl) + getCPPower(avgCP) + 312500)
                );
            }

            let chart1, chart2;

            function updateChart1() {
                const avgCP = parseFloat(
                    document.getElementById("fixedCP1").value,
                );
                const labels = [];
                const data = [];
                for (let lvl = 200; lvl <= 300; lvl += 1) {
                    labels.push(lvl);
                    data.push(calcLegionPower(lvl, avgCP));
                }
                chart1.data.labels = labels;
                chart1.data.datasets[0].data = data;
                chart1.update();
            }

            function updateChart2() {
                const avgLvl = parseFloat(
                    document.getElementById("fixedLvl2").value,
                );
                const labels = [];
                const data = [];
                // Step by 10M for smoother curve up to 200M
                for (let cp = 1000000; cp <= 200000000; cp += 1000000) {
                    labels.push((cp / 1000000).toFixed(1) + "m");
                    data.push(calcLegionPower(avgLvl, cp));
                }
                chart2.data.labels = labels;
                chart2.data.datasets[0].data = data;
                chart2.update();
            }

            const ctx1 = document.getElementById("chart1").getContext("2d");
            chart1 = new Chart(ctx1, {
                type: "line",
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "Total Legion Raid Power",
                            data: [],
                            borderColor: "#ff4757",
                            backgroundColor: "rgba(255, 71, 87, 0.1)",
                            fill: true,
                        },
                    ],
                },
                options: { scales: { y: { min: 0, max: 2000000000 } } },
            });

            const ctx2 = document.getElementById("chart2").getContext("2d");
            chart2 = new Chart(ctx2, {
                type: "line",
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "Total Legion Raid Power",
                            data: [],
                            borderColor: "#2ed573",
                            backgroundColor: "rgba(46, 213, 115, 0.1)",
                            fill: true,
                        },
                    ],
                },
                options: { scales: { y: { min: 0, max: 2000000000 } } },
            });

            updateChart1();
            updateChart2();
        </script>
    </body>
</html>
