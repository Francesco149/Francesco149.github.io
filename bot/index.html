    if (now > uData.reset_at) { uData.count = 0; uData.reset_at = now + WEEK; }

ferrer" class="svelte-asg5zg">dev.twitch.tv</a> and enter your Client ID.</span></div></div> <div class="step svelte-asg5zg"><div class="step-n svelte-asg5zg">2</div> <div class="step-body svelte-asg5zg"><strong class="svelte-asg5zg">Configure</strong> <span>Go to the <em class="svelte-asg5zg">Config</em> tab, load the example config, replace <code>mychannel</code> with your Twitch channel name, and save.</span></div></div> <div class="step svelte-asg5zg"><div class="step-n svelte-asg5zg">3</div> <div class="step-body svelte-asg5zg"><strong class="svelte-asg5zg">Start</strong> <span>Go to the <em class="svelte-asg5zg">Bot</em> tab and click <em class="svelte-asg5zg">Start bot</em>. The bot connects via Twitch EventSub and is immediately active in your channel.</span></div></div> <div class="step svelte-asg5zg"><div class="step-n svelte-asg5zg">4</div> <div class="step-body svelte-asg5zg"><strong class="svelte-asg5zg">Keep the tab open</strong> <span>The bot runs as long as the browser tab is open. For 24/7 uptime, use the Python shigebot or host the page on a persistent machine.</span></div></div></div></div> <div class="notes svelte-asg5zg"><div class="note svelte-asg5zg"><strong class="svelte-asg5zg">Allowed redirect URLs (default app)</strong> <code class="svelte-asg5zg">http://localhost:8080/</code> <code class="svelte-asg5zg">http://localhost:18756/</code> <code class="svelte-asg5zg">http://localhost:5173/</code> <span class="dim svelte-asg5zg">For other ports, register your own Twitch app and enter a custom Client ID in the Auth tab.</span></div></div> <button class="cta-bottom svelte-asg5zg">Get started →</button></div>`);function cd(t,e){var n=ld(),s=f(n),r=d(f(s),6),a=d(s,8);$("click",r,function(...i){e.onGetStarted?.apply(this,i)}),$("click",a,function(...i){e.onGetStarted?.apply(this,i)}),E(t,n)}$t(["click"]);var ud=T('<span class="badge-dot svelte-1n46o8q"></span>'),dd=T("<li><button> <!></button></li>"),fd=T('<div class="app svelte-1n46o8q"><nav class="
